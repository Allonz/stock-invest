spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/stock_invest?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD:}
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

logging:
  level:
    root: WARN
    com.stock.invest: INFO
    org.springframework.test: WARN

scanner:
  defaultLimit: 20
  defaultMarket: US

gap-fill:
  min-price-threshold: 1.00
  # 字段增补开关：集成测试关闭（避免 fillGaps 触发真实外部 API 调用拖慢测试）
  field-fill-enabled: false

